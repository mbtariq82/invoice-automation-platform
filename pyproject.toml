[project]
name = "invoice-automation-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bilal", email = "mbtariq82@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.36.1",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
invoice-automation-platform = "invoice_automation_platform:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
