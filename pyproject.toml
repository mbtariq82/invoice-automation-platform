[project]
name = "invoice-automation-platform"
version = "0.1.0"
description = "LLM-powered invoice extraction API, CLI, and benchmark harness"
readme = "README.md"
authors = [
    { name = "Bilal", email = "mbtariq82@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.8.0",
    "google-crc32c>=1.9.0",
    "openai>=3.36.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
invoice-automation-platform = "invoice_automation_platform.runner:main"
invoice-api = "invoice_automation_platform.api:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
